<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>دعوتنامه تولد</title>
    <style>
        body {
            margin: 0; padding: 0; display: flex; justify-content: center; align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #090212 0%, #2a0825 50%, #081321 100%); 
            font-family: Tahoma, Arial, sans-serif; overflow: hidden; perspective: 1200px;
        }

        /* ----- بهینه‌سازی سخت‌افزاری ----- */
        .card, .corner-chest-wrapper, .sp-group, .princess-group, .hk-doll, .firework, .fw-particle, .confetti {
            will-change: transform;
            backface-visibility: hidden;
        }

        /* ستاره‌های چشمک‌زن */
        .stars { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
        .star { position: absolute; background: white; border-radius: 50%; animation: twinkle infinite alternate; will-change: opacity; }
        @keyframes twinkle { 0% { opacity: 0.1; transform: scale(0.5); } 100% { opacity: 1; transform: scale(1.5); box-shadow: 0 0 4px white; } }

        /* ----- پاکت نامه و عکس ----- */
        .envelope-container {
            position: relative; width: 300px; height: 200px; cursor: pointer; transition: transform 0.3s ease;
            z-index: 1000;
        }
        .envelope-container:hover { transform: scale(1.05); }

        .envelope-back { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: #d81b60; border-radius: 5px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); z-index: 1; }

        .card {
            position: absolute; top: 5px; left: 75px; width: 150px; height: 190px;
            background-color: #fff; border-radius: 5px; z-index: 2;
            display: flex; justify-content: center; align-items: center; overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2); transform-origin: center center;
        }
        .card img { width: 100%; height: 100%; object-fit: cover; }

        .envelope-front { position: absolute; bottom: 0; left: 0; width: 0; height: 0; border-left: 150px solid transparent; border-right: 150px solid transparent; border-bottom: 120px solid #f06292; z-index: 3; }
        .envelope-front-sides { position: absolute; top: 0; left: 0; width: 0; height: 0; border-top: 100px solid transparent; border-bottom: 100px solid transparent; border-left: 150px solid #ec407a; z-index: 3; }
        .envelope-front-sides.right { left: auto; right: 0; border-left: none; border-right: 150px solid #ec407a; }
        .envelope-flap { position: absolute; top: 0; left: 0; width: 0; height: 0; border-left: 150px solid transparent; border-right: 150px solid transparent; border-top: 120px solid #f48fb1; z-index: 4; transform-origin: top; transition: transform 0.5s ease-in-out; }

        .envelope-text { position: absolute; z-index: 50; bottom: 20px; width: 100%; text-align: center; color: #fff; font-size: 18px; font-weight: bold; pointer-events: none; text-shadow: 2px 2px 5px rgba(0,0,0,1); }
        .balloon-icon { font-size: 26px; display: block; margin-bottom: 5px; animation: float 2s infinite ease-in-out alternate; }
        @keyframes float { 0% { transform: translateY(0); } 100% { transform: translateY(-8px); } }

        /* انیمیشن خروج عکس (دسکتاپ) */
        .envelope-container.open .envelope-flap { transform: rotateX(180deg); z-index: 1; }
        .envelope-container.open .card { animation: cardOutAndCenter 2.5s ease-in-out 0.4s forwards; }

        @keyframes cardOutAndCenter {
            0% { transform: translateY(0) scale(1); z-index: 2; height: 190px; }
            40% { transform: translateY(-300px) scale(1.2); z-index: 1500; height: 190px; }
            100% { transform: translateY(20px) scale(3.2); z-index: 1500; height: 250px; box-shadow: 0 40px 150px rgba(0,0,0,1); }
        }
        .envelope-container.open .envelope-text { opacity: 0; transition: opacity 0.3s; }

        /* ----- صندوقچه جواهر ----- */
        .corner-chest-wrapper {
            position: fixed; width: 100px; right: -5px; top: 5px; 
            z-index: 3000; cursor: pointer; opacity: 0; pointer-events: none;
            display: flex; flex-direction: column; align-items: center;
            transform: translateY(-150px);
            transition: transform 1.2s cubic-bezier(0.25, 1, 0.5, 1), opacity 1s ease-in-out;
        }
        .corner-chest-wrapper.show { pointer-events: auto; opacity: 1; transform: translateY(0); }

        .click-me-hint {
            background: #ff0055; color: #fff; font-size: 11px; font-weight: bold;
            padding: 4px 10px; border-radius: 12px; text-align: center;
            box-shadow: 0 0 10px rgba(255, 0, 85, 0.8), 0 0 20px white;
            margin-bottom: 8px; position: relative; animation: hintBounce 0.6s infinite alternate ease-in-out; border: 1px solid white;
        }
        .click-me-hint::after { content: ''; position: absolute; bottom: -5px; left: 50%; transform: translateX(-50%); border-left: 5px solid transparent; border-right: 5px solid transparent; border-top: 5px solid #ff0055; }
        @keyframes hintBounce { 0% { transform: translateY(0); } 100% { transform: translateY(-8px); } }

        .corner-chest-inner { position: relative; width: 65px; height: 50px; animation: chestPulse 1s infinite alternate; }
        @keyframes chestPulse { 0% { transform: scale(1); filter: drop-shadow(0 0 5px #ffd700); } 100% { transform: scale(1.05); filter: drop-shadow(0 0 20px #ff00ff); } }

        .chest-base {
            position: absolute; bottom: 0; width: 100%; height: 32px; border-radius: 4px; border: 2px solid #5a3f00; box-sizing: border-box; box-shadow: inset 0 5px 10px rgba(255, 215, 0, 0.5); z-index: 1;
            background-image: radial-gradient(circle at 12px 18px, #ff0055 3px, transparent 4px), radial-gradient(circle at 50px 18px, #00ffcc 3px, transparent 4px), radial-gradient(circle at 30px 6px, #00ff00 2px, transparent 3px), linear-gradient(to right, #8B6508, #ffd700, #8B6508);
        }
        .chest-lid {
            position: absolute; top: 0; width: 100%; height: 20px; border-radius: 20px 20px 0 0; border: 2px solid #5a3f00; box-sizing: border-box; transform-origin: bottom; transition: transform 0.6s ease-in-out; box-shadow: inset 0 5px 10px rgba(255, 255, 255, 0.4); z-index: 2;
            background-image: radial-gradient(circle at 18px 8px, #ff0055 2.5px, transparent 3.5px), radial-gradient(circle at 45px 8px, #00ffcc 2.5px, transparent 3.5px), linear-gradient(to right, #8B6508, #ffd700, #8B6508);
        }
        .chest-lock-diamond { position: absolute; top: 8px; left: 50%; transform: translateX(-50%); width: 22px; height: 22px; background: #fff8dc; border-radius: 50%; border: 2px solid #b8860b; display: flex; justify-content: center; align-items: center; box-shadow: 0 0 10px gold, inset 0 0 5px gold; z-index: 3;}
        .chest-lock-diamond::before { content: '💎'; font-size: 13px; line-height: 1; text-shadow: 0 0 5px #fff; }
        .chest-diamond-inside { position: absolute; top: 10px; left: 50%; transform: translateX(-50%) scale(0); font-size: 25px; transition: all 0.5s ease-out; text-shadow: 0 0 15px gold; opacity: 0; z-index: 0;}

        .corner-chest-wrapper.open .chest-lid { transform: rotateX(110deg); }
        .corner-chest-wrapper.open .chest-diamond-inside { transform: translateX(-50%) translateY(-35px) scale(1.5); opacity: 1; }
        .corner-chest-wrapper.open .click-me-hint { opacity: 0; pointer-events: none; }
        .corner-chest-wrapper.open .corner-chest-inner { animation: none; filter: drop-shadow(0 0 30px gold); }

        /* ----- مودال ویدیو ----- */
        .video-modal {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0);
            width: 90%; max-width: 500px; background: #000; padding: 10px; border-radius: 10px;
            z-index: 5000; box-shadow: 0 0 30px rgba(255,215,0,0.8), 0 0 80px rgba(255,0,255,0.4);
            opacity: 0; transition: all 0.5s ease-in-out; pointer-events: none; display: flex; flex-direction: column; align-items: center;
        }
        .video-modal.active { transform: translate(-50%, -50%) scale(1); opacity: 1; pointer-events: auto; }
        .video-modal video { width: 100%; border-radius: 5px; outline: none; background: #111; }
        .close-vid-btn { margin-top: 10px; padding: 8px 25px; background: #d81b60; color: #fff; border: 1px solid #fff; border-radius: 20px; cursor: pointer; font-family: inherit; font-weight: bold; box-shadow: 0 0 10px rgba(216, 27, 96, 0.8); }

        /* ----- کاراکترها همیشه پشت عکس ----- */
        .sp-group, .princess-group, .angels-fixed-container, .hk-doll { z-index: 60 !important; }

        /* ----- باب اسفنجی و پاتریک ----- */
        .sp-group { position: absolute; bottom: -300px; right: 5%; display: flex; justify-content: center; align-items: center; gap: 40px; transition: bottom 1s ease-in-out; perspective: 800px; pointer-events: none; }
        .sp-group.show { bottom: 50px; }
        .cube { width: 80px; height: 100px; position: relative; transform-style: preserve-3d; animation: danceBody 0.8s infinite alternate ease-in-out; }
        .pat.cube { width: 90px; height: 110px; animation-delay: 0.1s; }
        @keyframes danceBody { 0% { transform: translateY(0) rotateY(-15deg) rotateZ(-5deg); } 100% { transform: translateY(-30px) rotateY(15deg) rotateZ(5deg); } }
        
        .face { position: absolute; box-sizing: border-box; border-radius: 4px; }
        .sb .front { width:80px; height:100px; transform:translateZ(20px); } .sb .back { width:80px; height:100px; transform:rotateY(180deg) translateZ(20px); } .sb .left { width:40px; height:100px; left:20px; transform:rotateY(-90deg) translateZ(40px); } .sb .right { width:40px; height:100px; left:20px; transform:rotateY(90deg) translateZ(40px); } .sb .top { width:80px; height:40px; top:30px; transform:rotateX(90deg) translateZ(50px); } .sb .bottom { width:80px; height:40px; top:30px; transform:rotateX(-90deg) translateZ(50px); }
        .sb .face { background-color: #fde910; border: 1px solid #d4c300; } .sb .front, .sb .back, .sb .left, .sb .right { background: linear-gradient(to bottom, #fde910 65%, white 65%, white 75%, #8b5a2b 75%, #8b5a2b 100%); } 
        
        .pat .front { width:90px; height:110px; transform:translateZ(25px); } .pat .back { width:90px; height:110px; transform:rotateY(180deg) translateZ(25px); } .pat .left { width:50px; height:110px; left:20px; transform:rotateY(-90deg) translateZ(45px); } .pat .right { width:50px; height:110px; left:20px; transform:rotateY(90deg) translateZ(45px); } .pat .top { width:90px; height:50px; top:30px; transform:rotateX(90deg) translateZ(55px); } .pat .bottom { width:90px; height:50px; top:30px; transform:rotateX(-90deg) translateZ(55px); }
        .pat .face { background-color: #ff77aa; border: 1px solid #e65c8d; } .pat .front, .pat .back, .pat .left, .pat .right { background: linear-gradient(to bottom, #ff77aa 60%, #b2e672 60%, #b2e672 100%); border-radius: 50% 50% 15% 15% / 100% 100% 15% 15%; } 
        .pat .top { display: none; }

        .eyes { position: absolute; top: 15px; width: 100%; display: flex; justify-content: center; gap: 4px; transform: translateZ(1px); } .eye { width: 20px; height: 20px; background: white; border-radius: 50%; border: 1px solid black; position: relative; } .eye::after { content: ''; position: absolute; width: 6px; height: 6px; background: #33ccff; border: 2px solid black; border-radius: 50%; top: 4px; left: 4px; } .pat .eye { width: 14px; height: 14px; } .pat .eye::after { background: black; border: none; top: 3px; left: 3px; width: 4px; height: 4px;}
        .smile { position: absolute; top: 45px; left: 15px; width: 50px; height: 10px; border-bottom: 2px solid black; border-radius: 0 0 20px 20px; } .pat .smile { top: 40px; width: 40px; left: 25px; } .sb-nose { position: absolute; top: 35px; left: 35px; width: 10px; height: 12px; background: #fde910; border: 1px solid #d4c300; border-radius: 50%; transform: translateZ(35px); }
        
        .limb { position: absolute; background: #fde910; border: 1px solid #d4c300; border-radius: 10px; transform-origin: top center; } 
        
        .sb .arm-left { width: 6px; height: 40px; top: 40px; left: -10px; animation: waveLeft 0.8s infinite alternate; } .sb .arm-right { width: 6px; height: 50px; top: 40px; right: -10px; transform: rotateZ(-55deg) rotateY(20deg); } .sb .leg-left { width: 6px; height: 30px; bottom: -30px; left: 20px; background: #fde910; animation: step 0.4s infinite alternate; } .sb .leg-right { width: 6px; height: 30px; bottom: -30px; right: 20px; background: #fde910; animation: step 0.4s infinite alternate-reverse; }
        .pat .leg-left { width: 22px; height: 35px; bottom: -30px; left: 15px; background: #b2e672; border: 1px solid #e65c8d; border-radius: 10% 10% 50% 50% / 10% 10% 100% 100%; animation: step 0.4s infinite alternate-reverse; } 
        .pat .leg-right { width: 22px; height: 35px; bottom: -30px; right: 15px; background: #b2e672; border: 1px solid #e65c8d; border-radius: 10% 10% 50% 50% / 10% 10% 100% 100%; animation: step 0.4s infinite alternate; }
        .shoe { position: absolute; bottom: -5px; left: -5px; width: 16px; height: 10px; background: black; border-radius: 5px 5px 2px 2px; } .pat .shoe { display: none; }
        @keyframes waveLeft { 0% { transform: rotateZ(20deg); } 100% { transform: rotateZ(70deg); } } 
        @keyframes step { 0% { transform: translateY(0) rotateX(0); } 100% { transform: translateY(-10px) rotateX(20deg); } }

        /* ----- پرنسس‌های واقعی سه‌بعدی دیزنی ----- */
        .princess-group { position: absolute; bottom: -300px; left: 5%; display: flex; gap: 35px; transition: bottom 1.5s ease-in-out; perspective: 1200px; pointer-events: none; }
        .princess-group.show { bottom: 45%; }
        
        .p-3d { width: 60px; height: 140px; position: relative; transform-style: preserve-3d; }
        .p-3d.cin { animation: spin3D 4s infinite linear; } .p-3d.sw { animation: spin3D 4.5s infinite linear reverse; } .p-3d.elsa { animation: spin3D 3.5s infinite linear; } .p-3d.mer { animation: spin3D 5s infinite linear reverse; }
        @keyframes spin3D { 0% { transform: rotateY(0deg) translateY(0); } 50% { transform: rotateY(180deg) translateY(-15px); } 100% { transform: rotateY(360deg) translateY(0); } }

        .p-head { position: absolute; top: -30px; left: 15px; width: 30px; height: 30px; transform-style: preserve-3d; }
        .p-face-h { position: absolute; width: 30px; height: 30px; border-radius: 4px; box-sizing: border-box; }
        .p-front-h { transform: translateZ(15px); background: #ffe0bd; display: flex; justify-content: center; align-items: center; flex-direction: column; } .p-back-h { transform: rotateY(180deg) translateZ(15px); } .p-left-h { transform: rotateY(-90deg) translateZ(15px); } .p-right-h { transform: rotateY(90deg) translateZ(15px); } .p-top-h { transform: rotateX(90deg) translateZ(15px); }
        .p-eyes { display: flex; gap: 4px; margin-top: 5px; } .p-eye { width: 4px; height: 5px; background: #000; border-radius: 50%; } .p-smile { width: 8px; height: 4px; border-bottom: 2px solid #ff4d4d; border-radius: 50%; margin-top: 4px; }

        .p-torso { position: absolute; top: 0px; left: 15px; width: 30px; height: 40px; transform-style: preserve-3d; } .p-face-t { position: absolute; box-sizing: border-box; } .p-front-t { width: 30px; height: 40px; transform: translateZ(10px); } .p-back-t { width: 30px; height: 40px; transform: rotateY(180deg) translateZ(10px); } .p-left-t { width: 20px; height: 40px; transform: rotateY(-90deg) translateZ(15px); left: 5px; } .p-right-t { width: 20px; height: 40px; transform: rotateY(90deg) translateZ(15px); left: 5px; }
        .p-arm { position: absolute; width: 8px; height: 35px; top: 2px; transform-origin: top center; border-radius: 4px; background: #ffe0bd; } .p-arm.left { left: -8px; transform: rotateZ(35deg) rotateX(20deg); } .p-arm.right { right: -8px; transform: rotateZ(-35deg) rotateX(20deg); }

        .p-skirt { position: absolute; top: 40px; left: -10px; width: 80px; height: 90px; transform-style: preserve-3d; }
        .p-panel { position: absolute; left: 15px; width: 50px; height: 90px; clip-path: polygon(35% 0, 65% 0, 100% 100%, 0 100%); transform-origin: top center; }
        .p-panel:nth-child(1) { transform: rotateY(0deg) translateZ(24px) rotateX(20deg); } .p-panel:nth-child(2) { transform: rotateY(45deg) translateZ(24px) rotateX(20deg); } .p-panel:nth-child(3) { transform: rotateY(90deg) translateZ(24px) rotateX(20deg); } .p-panel:nth-child(4) { transform: rotateY(135deg) translateZ(24px) rotateX(20deg); } .p-panel:nth-child(5) { transform: rotateY(180deg) translateZ(24px) rotateX(20deg); } .p-panel:nth-child(6) { transform: rotateY(225deg) translateZ(24px) rotateX(20deg); } .p-panel:nth-child(7) { transform: rotateY(270deg) translateZ(24px) rotateX(20deg); } .p-panel:nth-child(8) { transform: rotateY(315deg) translateZ(24px) rotateX(20deg); }

        .cin .p-face-h:not(.p-front-h) { background: #f0e68c; } .cin .p-face-t { background: #87cefa; } .cin .p-panel { background: linear-gradient(to bottom, #87cefa, #e0ffff); border: 1px solid #b0e0e6; }
        .sw .p-face-h:not(.p-front-h) { background: #1a1a1a; } .sw .p-face-t { background: #0000cd; border-bottom: 2px solid red; } .sw .p-arm { background: #add8e6; border-top: 5px solid red; } .sw .p-panel { background: linear-gradient(to bottom, #ffd700, #ffcc00); border: 1px solid #daa520; }
        .elsa .p-face-h:not(.p-front-h) { background: #fffafa; } .elsa .p-face-t { background: #00ffff; box-shadow: 0 0 10px white; } .elsa .p-panel { background: linear-gradient(to bottom, #e0ffff, #00ffff); border: 1px solid white; box-shadow: 0 0 5px #00ffff; } .elsa .p-cape { position: absolute; top: 0; left: -10px; width: 50px; height: 120px; background: rgba(224, 255, 255, 0.6); transform: translateZ(-15px) rotateX(-15deg); }
        .mer .p-face-h:not(.p-front-h) { background: #ff4500; border-radius: 10px; transform: scale(1.1); } .mer .p-face-t { background: #006400; border-bottom: 3px solid #daa520; } .mer .p-panel { background: linear-gradient(to bottom, #006400, #004d00); border: 1px solid #003300; }

        .music-notes { position: absolute; top: -50px; left: 0; width: 100%; height: 100px; }
        .note { position: absolute; font-size: 20px; color: #ff69b4; opacity: 0; animation: sing 2s infinite linear; }
        @keyframes sing { 0% { transform: translate(0, 0) scale(0.5); opacity: 1; } 100% { transform: translate(var(--mx), -60px) scale(1.5); opacity: 0; } }

        /* ----- فرشته‌های رقصان در آسمان ----- */
        .angels-fixed-container { position: fixed; top: 5%; width: 100%; height: 100%; pointer-events: none; display: none; }
        .angels-fixed-container.show { display: block; }
        .angel-wrapper { position: absolute; width: 60px; height: 70px; }
        .angel-wrapper.a1 { left: 10%; animation: angelDance 3s infinite alternate ease-in-out; } .angel-wrapper.a2 { left: 30%; top: -20px; animation: angelDance 2.5s infinite alternate-reverse ease-in-out; } .angel-wrapper.a3 { left: 50%; animation: angelDance 3.5s infinite alternate ease-in-out; } .angel-wrapper.a4 { right: 30%; top: -10px; animation: angelDance 2.8s infinite alternate-reverse ease-in-out; transform: scaleX(-1); } .angel-wrapper.a5 { right: 10%; animation: angelDance 3.2s infinite alternate ease-in-out; transform: scaleX(-1); }
        @keyframes angelDance { 0% { transform: translateY(0) rotate(10deg); } 100% { transform: translateY(-30px) rotate(-10deg); } }
        
        .angel-char { position: absolute; width: 100%; height: 100%; }
        .halo { position: absolute; width: 20px; height: 6px; border: 2px solid #ffd700; border-radius: 50%; top: -8px; left: 18px; box-shadow: 0 0 10px #ffd700; }
        .wing { position: absolute; width: 25px; height: 15px; background: rgba(255,255,255,0.9); border-radius: 20px 20px 0 20px; top: 15px; box-shadow: 0 0 15px white; transform-origin: right center; z-index: 0; } .wing.left { left: -5px; animation: flapL 0.1s infinite alternate; } .wing.right { right: 0; left: 40px; border-radius: 20px 20px 20px 0; transform-origin: left center; animation: flapR 0.1s infinite alternate; }
        
        .angel-head { position: absolute; width: 24px; height: 24px; background: #ffe0bd; border-radius: 50%; top: 5px; left: 18px; z-index: 2; } .angel-hair { position: absolute; width: 28px; height: 12px; background: #ffcc00; border-radius: 14px 14px 0 0; top: -2px; left: -2px; }
        .angel-eye { position: absolute; width: 3px; height: 3px; background: #000; border-radius: 50%; top: 12px; z-index: 5; } .angel-eye.left { left: 5px; } .angel-eye.right { right: 5px; }
        .angel-blush { position: absolute; width: 4px; height: 3px; background: #ffb6c1; border-radius: 50%; top: 15px; z-index: 5; } .angel-blush.left { left: 2px; } .angel-blush.right { right: 2px; }
        .angel-smile { position: absolute; width: 6px; height: 3px; border-bottom: 1px solid #000; border-radius: 50%; top: 15px; left: 9px; z-index: 5; }
        .angel-body { position: absolute; width: 20px; height: 26px; background: #fff; border-radius: 10px 10px 4px 4px; top: 26px; left: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); z-index: 1;}
        .angel-arm { position: absolute; width: 6px; height: 14px; background: #ffe0bd; border-radius: 3px; top: 28px; z-index: 3; } .angel-arm.left { left: 12px; transform: rotate(30deg); animation: angelWave 1s infinite alternate;} .angel-arm.right { right: 12px; transform: rotate(-30deg); }
        .angel-leg { position: absolute; width: 6px; height: 12px; background: #ffe0bd; border-radius: 3px; bottom: 8px; z-index: 0;} .angel-leg.left { left: 22px; } .angel-leg.right { right: 22px; }
        @keyframes flapL { from { transform: rotate(10deg); } to { transform: rotate(-50deg); } } @keyframes flapR { from { transform: rotate(-10deg); } to { transform: rotate(50deg); } } @keyframes angelWave { from { transform: rotate(30deg); } to { transform: rotate(80deg); } }

        /* ----- هلو کیتی‌های آزاد و شناور ----- */
        .hk-doll { position: fixed; width: 40px; height: 50px; top: 0; left: 0; transform-origin: top left; pointer-events: none; }
        .hk-head { position: absolute; width: 36px; height: 26px; background: white; border-radius: 45%; top: 0; left: 2px; z-index: 2; box-shadow: inset -2px -2px 5px rgba(0,0,0,0.1); }
        .hk-ear { position: absolute; width: 12px; height: 12px; background: white; top: -3px; } .hk-ear.left { left: 2px; border-radius: 5px 0 0 0; transform: rotate(-20deg); } .hk-ear.right { right: 2px; border-radius: 0 5px 0 0; transform: rotate(20deg); }

        .hk-leg { position: absolute; width: 8px; height: 12px; background: white; border-radius: 4px; bottom: 0; transform-origin: top center; z-index: 0; } .hk-leg.left { left: 10px; animation: hkStep 0.3s infinite alternate; } .hk-leg.right { right: 10px; animation: hkStep 0.3s infinite alternate-reverse; }

        /* ----- آتش بازی ----- */

    <script>
        const isMobile = window.innerWidth <= 768;

        function createStars() {
            const starContainer = document.getElementById('stars');
            const count = isMobile ? 20 : 100; // کاهش برای جلوگیری از لگ
            for(let i=0; i<count; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.width = Math.random() * 4 + 'px';
                star.style.height = star.style.width;
                star.style.left = Math.random() * 100 + 'vw';
                star.style.top = Math.random() * 100 + 'vh';
                star.style.animationDuration = (Math.random() * 2 + 0.5) + 's';
                star.style.animationDelay = Math.random() * 2 + 's';
                starContainer.appendChild(star);
            }
        }
        createStars();

        // کلیک روی پاکت نامه اصلی
        document.getElementById('envelope').addEventListener('click', function() {
            if (this.classList.contains('open')) return;
            this.classList.add('open');

            // منطق پیشرفته پخش صدا پس از ۱ ثانیه
            const audio = document.getElementById('birthday-song');
            if (audio) {
                // ترفند باز کردن قفل مرورگر در موبایل: بلافاصله پخش و توقف می‌کنیم
                audio.play().then(() => {
                    audio.pause();
                    audio.currentTime = 0;
                    
                    // پخش نهایی و واقعی دقیقاً پس از 1000 میلی‌ثانیه (1 ثانیه)
                    setTimeout(() => {
                        audio.play().catch(e => console.log(e));
                    }, 1000);

                }).catch(err => {
                    // در صورت بروز خطا (مثلا محدودیت مرورگر)، با تاخیر 1 ثانیه دوباره تلاش می‌کند
                    setTimeout(() => {
                        audio.play().catch(e => console.log(e));
                    }, 1000);
                });
            }

            createConfetti();
            createHelloKitties(); // اجرای کیتی‌ها
            startFireworks();

            document.getElementById('spongebob').classList.add('show');
            document.getElementById('princesses').classList.add('show');
            document.getElementById('angels').classList.add('show');
            
            // نمایش صندوقچه جادویی
            document.getElementById('cornerChest').classList.add('show');
        });

        // کلیک روی صندوقچه جواهر
        document.getElementById('cornerChest').addEventListener('click', function() {
            this.classList.add('open');
            setTimeout(() => {
                document.getElementById('videoModal').classList.add('active');
                const video = document.getElementById('my-video');
                video.play().catch(e => console.log('خطا در پخش ویدیو', e));
            }, 600);
        });

        // بستن ویدیو
        document.getElementById('closeVideo').addEventListener('click', function() {
            const video = document.getElementById('my-video');
            video.pause();
            document.getElementById('videoModal').classList.remove('active');
            document.getElementById('cornerChest').classList.remove('open');
        });

        function createConfetti() {
            const colors = ['#ff0044', '#00ff44', '#4400ff', '#ffdd00', '#00eeff', '#ff00dd', '#ffffff'];
            const count = isMobile ? 30 : 100; // کاهش برای سبکی موبایل
            for (let i = 0; i < count; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.classList.add('confetti');
                    confetti.style.left = Math.random() * 100 + 'vw';
                    confetti.style.top = '-' + (Math.random() * 20 + 10) + 'px';
                    confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                    const duration = Math.random() * 3 + 2;
                    confetti.style.animation = `fall ${duration}s linear forwards`;
                    document.body.appendChild(confetti);
                    setTimeout(() => confetti.remove(), duration * 1000);
                }, i * 20);
            }
        }

        // ----- سیستم هوشمند پرواز عروسک‌های هلو کیتی در پس‌زمینه -----
        const kitties = [];
        let kittyLoopStarted = false;
        let screenW = window.innerWidth;
        let screenH = window.innerHeight;

        window.addEventListener('resize', () => {
            screenW = window.innerWidth;
            screenH = window.innerHeight;
        });

        function createHelloKitties() {
            const count = isMobile ? 4 : 20; // 4 عروسک هلوکیتی برای گوشی، تا از لگ شدن جلوگیری کند
            for (let i = 0; i < count; i++) {
                setTimeout(() => {
                    const hk = document.createElement('div');
                    hk.className = 'hk-doll';
                    hk.innerHTML = `
                        <div class="hk-ear left"></div><div class="hk-ear right"></div>
                        <div class="hk-head">
                            <div class="hk-bow"><div class="hk-bow-part left"></div><div class="hk-bow-part right"></div><div class="hk-bow-center"></div></div>
                            <div class="hk-eye left"></div><div class="hk-eye right"></div>
                            <div class="hk-nose"></div>
                            <div class="hk-whisker" style="top:11px;left:1px;transform:rotate(15deg);"></div>
                            <div class="hk-whisker" style="top:15px;left:0px;"></div>
                            <div class="hk-whisker" style="top:19px;left:1px;transform:rotate(-15deg);"></div>
                            <div class="hk-whisker" style="top:11px;right:1px;transform:rotate(-15deg);"></div>
                            <div class="hk-whisker" style="top:15px;right:0px;"></div>
                            <div class="hk-whisker" style="top:19px;right:1px;transform:rotate(15deg);"></div>
                        </div>
                        <div class="hk-body"></div>
                        <div class="hk-arm left"></div><div class="hk-arm right"></div>
                        <div class="hk-leg left"></div><div class="hk-leg right"></div>
                    `;
                    
                    const dressColors = ['#ff69b4', '#ff1493', '#ff00ff', '#ffb6c1', '#db7093'];
                    hk.querySelector('.hk-body').style.backgroundColor = dressColors[Math.floor(Math.random() * dressColors.length)];
                    
                    document.body.appendChild(hk);
                    
                    const scale = 0.6 + Math.random() * 0.4;
                    const w = 40 * scale;
                    const h = 50 * scale;
                    
                    let x = Math.random() * (screenW - w);
                    let y = Math.random() * (screenH - h);
                    
                    let vx = (Math.random() > 0.5 ? 1 : -1) * (1 + Math.random() * 2.5);
                    let vy = (Math.random() > 0.5 ? 1 : -1) * (1 + Math.random() * 2.5);
                    
                    kitties.push({ el: hk, x: x, y: y, vx: vx, vy: vy, w: w, h: h, scale: scale });
                }, i * 150);
            }

            if (!kittyLoopStarted) {
                kittyLoopStarted = true;
                requestAnimationFrame(animateKitties);
            }
        }

        function animateKitties() {
            for (let k of kitties) {
                k.x += k.vx;
                k.y += k.vy;

                if (k.x <= 0) { k.x = 0; k.vx *= -1; }
                if (k.x + k.w >= screenW) { k.x = screenW - k.w; k.vx *= -1; }

                if (k.y <= 0) { k.y = 0; k.vy *= -1; }
                if (k.y + k.h >= screenH) { k.y = screenH - k.h; k.vy *= -1; }

                k.el.style.transform = `translate(${k.x}px, ${k.y}px) scale(${k.scale})`;
            }
            requestAnimationFrame(animateKitties);
        }

        function startFireworks() {
            const interval = isMobile ? 2000 : 800; // تاخیر بسیار بیشتر در موبایل برای رفع کامل لگ
            setInterval(createFirework, interval); 
        }

        function createFirework() {
            const colors = ['#ff0044', '#00ff44', '#4400ff', '#ffdd00', '#00eeff', '#ff00dd', '#ffffff', '#ff8800'];
            const color = colors[Math.floor(Math.random() * colors.length)];
            
            const fw = document.createElement('div');
            fw.className = 'firework';
            const left = Math.random() * 95 + 2; 
            const height = -(Math.random() * 50 + 40);
            
            fw.style.left = left + 'vw';
            fw.style.color = color;
            fw.style.backgroundColor = '#fff'; 
            fw.style.setProperty('--fw-height', height + 'vh');
            document.body.appendChild(fw);

            setTimeout(() => {
                const rect = fw.getBoundingClientRect();
                createExplosion(rect.left, rect.top);
                fw.remove();
            }, 1000);
        }

        function createExplosion(x, y) {
            const particleCount = isMobile ? 12 : 40; // کاهش شدید ذرات برای گوشی‌های ضعیف‌تر
            const colors = ['#ff0044', '#00ff44', '#4400ff', '#ffdd00', '#00eeff', '#ff00dd', '#ffffff', '#ff8800'];
            
            for (let i = 0; i < particleCount; i++) {
                const pColor = colors[Math.floor(Math.random() * colors.length)]; 
                const p = document.createElement('div');
                p.className = 'fw-particle';
                p.style.left = x + 'px';
                p.style.top = y + 'px';
                p.style.backgroundColor = '#fff';
                p.style.color = pColor; 
                
                const angle = (i * 360) / particleCount + (Math.random() * 10);
                const velocity = 80 + Math.random() * 180; 
                const dx = Math.cos(angle * Math.PI / 180) * velocity;
                const dy = Math.sin(angle * Math.PI / 180) * velocity + 30;
                
                p.style.setProperty('--dx', dx + 'px');
                p.style.setProperty('--dy', dy + 'px');
                
                document.body.appendChild(p);
                setTimeout(() => p.remove(), 1200);
            }
        }
    </script>
</body>
