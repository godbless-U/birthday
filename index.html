<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>دعوتنامه تولد</title>
    <style>
        /* ========================================= */
        /* تنظیمات پایه و بهینه‌سازی گرافیکی (Anti-Lag) */
        /* ========================================= */
        body {
            margin: 0; padding: 0; display: flex; justify-content: center; align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #090212 0%, #2a0825 50%, #081321 100%); 
            font-family: Tahoma, Arial, sans-serif; overflow: hidden; perspective: 1200px;
        }

        .card, .corner-chest-wrapper, .char-img, .hk-doll, .firework, .fw-particle, .confetti {
            /* استفاده از پردازنده گرافیکی (GPU) گوشی برای جلوگیری از لگ */
            will-change: transform;
            backface-visibility: hidden;
        }

        /* ستاره‌های چشمک‌زن */
        .stars { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
        .star { position: absolute; background: white; border-radius: 50%; animation: twinkle infinite alternate; will-change: opacity; }
        @keyframes twinkle { 0% { opacity: 0.1; transform: scale(0.5); } 100% { opacity: 1; transform: scale(1.5); } }

        /* ========================================= */
        /* ----- پاکت نامه و عکس اصلی ----- */
        /* ========================================= */
        .envelope-container {
            position: relative; width: 300px; height: 200px; cursor: pointer; transition: transform 0.3s ease;
            z-index: 1000;
        }
        .envelope-container:hover { transform: scale(1.05); }

        .envelope-back { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: #d81b60; border-radius: 5px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); z-index: 1; }

        .card {
            position: absolute; top: 5px; left: 75px; width: 150px; height: 190px;
            background-color: #fff; border-radius: 5px; z-index: 2;
            display: flex; justify-content: center; align-items: center; overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2); transform-origin: center center;
        }
        .card img { width: 100%; height: 100%; object-fit: cover; }

        .envelope-front { position: absolute; bottom: 0; left: 0; width: 0; height: 0; border-left: 150px solid transparent; border-right: 150px solid transparent; border-bottom: 120px solid #f06292; z-index: 3; }
        .envelope-front-sides { position: absolute; top: 0; left: 0; width: 0; height: 0; border-top: 100px solid transparent; border-bottom: 100px solid transparent; border-left: 150px solid #ec407a; z-index: 3; }
        .envelope-front-sides.right { left: auto; right: 0; border-left: none; border-right: 150px solid #ec407a; }
        .envelope-flap { position: absolute; top: 0; left: 0; width: 0; height: 0; border-left: 150px solid transparent; border-right: 150px solid transparent; border-top: 120px solid #f48fb1; z-index: 4; transform-origin: top; transition: transform 0.5s ease-in-out; }

        .envelope-text { position: absolute; z-index: 50; bottom: 20px; width: 100%; text-align: center; color: #fff; font-size: 18px; font-weight: bold; pointer-events: none; text-shadow: 2px 2px 5px rgba(0,0,0,1); }
        .balloon-icon { font-size: 26px; display: block; margin-bottom: 5px; animation: float 2s infinite ease-in-out alternate; }
        @keyframes float { 0% { transform: translateY(0); } 100% { transform: translateY(-8px); } }

        /* انیمیشن خروج عکس (دسکتاپ) */
        .envelope-container.open .envelope-flap { transform: rotateX(180deg); z-index: 1; }
        .envelope-container.open .card { animation: cardOutAndCenter 2.5s ease-in-out 0.4s forwards; }

        @keyframes cardOutAndCenter {
            0% { transform: translateY(0) scale(1); z-index: 2; height: 190px; }
            40% { transform: translateY(-300px) scale(1.2); z-index: 1500; height: 190px; }
            100% { transform: translateY(20px) scale(3.2); z-index: 1500; height: 250px; box-shadow: 0 40px 150px rgba(0,0,0,1); }
        }
        .envelope-container.open .envelope-text { opacity: 0; transition: opacity 0.3s; }

        /* ========================================= */
        /* ----- صندوقچه جواهر (گوشه بالا راست) ----- */
        /* ========================================= */
        .corner-chest-wrapper {
            position: fixed; width: 100px; right: 20px; top: 20px; 
            z-index: 3000; cursor: pointer; opacity: 0; pointer-events: none;
            display: flex; flex-direction: column; align-items: center;
            transform: translateY(-150px);
            transition: transform 1.2s cubic-bezier(0.25, 1, 0.5, 1), opacity 1s ease-in-out;
        }
        .corner-chest-wrapper.show { pointer-events: auto; opacity: 1; transform: translateY(0); }

        .click-me-hint {
            background: #ff0055; color: #fff; font-size: 11px; font-weight: bold;
            padding: 4px 10px; border-radius: 12px; text-align: center;
            box-shadow: 0 0 10px rgba(255, 0, 85, 0.8), 0 0 20px white;
            margin-bottom: 8px; position: relative; animation: hintBounce 0.6s infinite alternate ease-in-out; border: 1px solid white;
        }
        .click-me-hint::after { content: ''; position: absolute; bottom: -5px; left: 50%; transform: translateX(-50%); border-left: 5px solid transparent; border-right: 5px solid transparent; border-top: 5px solid #ff0055; }
        @keyframes hintBounce { 0% { transform: translateY(0); } 100% { transform: translateY(-8px); } }

        .corner-chest-inner { position: relative; width: 65px; height: 50px; animation: chestPulse 1s infinite alternate; }
        @keyframes chestPulse { 0% { transform: scale(1); filter: drop-shadow(0 0 5px #ffd700); } 100% { transform: scale(1.05); filter: drop-shadow(0 0 15px #ff00ff); } }

        .chest-base {
            position: absolute; bottom: 0; width: 100%; height: 32px; border-radius: 4px; border: 2px solid #5a3f00; box-sizing: border-box; box-shadow: inset 0 5px 10px rgba(255, 215, 0, 0.5); z-index: 1;
            background-image: radial-gradient(circle at 12px 18px, #ff0055 3px, transparent 4px), radial-gradient(circle at 50px 18px, #00ffcc 3px, transparent 4px), radial-gradient(circle at 30px 6px, #00ff00 2px, transparent 3px), linear-gradient(to right, #8B6508, #ffd700, #8B6508);
        }
        .chest-lid {
            position: absolute; top: 0; width: 100%; height: 20px; border-radius: 20px 20px 0 0; border: 2px solid #5a3f00; box-sizing: border-box; transform-origin: bottom; transition: transform 0.6s ease-in-out; box-shadow: inset 0 5px 10px rgba(255, 255, 255, 0.4); z-index: 2;
            background-image: radial-gradient(circle at 18px 8px, #ff0055 2.5px, transparent 3.5px), radial-gradient(circle at 45px 8px, #00ffcc 2.5px, transparent 3.5px), linear-gradient(to right, #8B6508, #ffd700, #8B6508);
        }
        .chest-lock-diamond { position: absolute; top: 8px; left: 50%; transform: translateX(-50%); width: 22px; height: 22px; background: #fff8dc; border-radius: 50%; border: 2px solid #b8860b; display: flex; justify-content: center; align-items: center; box-shadow: 0 0 10px gold, inset 0 0 5px gold; z-index: 3;}
        .chest-lock-diamond::before { content: '💎'; font-size: 13px; line-height: 1; text-shadow: 0 0 5px #fff; }
        .chest-diamond-inside { position: absolute; top: 10px; left: 50%; transform: translateX(-50%) scale(0); font-size: 25px; transition: all 0.5s ease-out; text-shadow: 0 0 15px gold; opacity: 0; z-index: 0;}

        .corner-chest-wrapper.open .chest-lid { transform: rotateX(110deg); }
        .corner-chest-wrapper.open .chest-diamond-inside { transform: translateX(-50%) translateY(-35px) scale(1.5); opacity: 1; }
        .corner-chest-wrapper.open .click-me-hint { opacity: 0; pointer-events: none; }
        .corner-chest-wrapper.open .corner-chest-inner { animation: none; filter: drop-shadow(0 0 20px gold); }

        /* ----- مودال ویدیو ----- */
        .video-modal {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0);
            width: 90%; max-width: 500px; background: #000; padding: 10px; border-radius: 10px;
            z-index: 5000; box-shadow: 0 0 30px rgba(255,215,0,0.8);
            opacity: 0; transition: all 0.5s ease-in-out; pointer-events: none; display: flex; flex-direction: column; align-items: center;
        }
        .video-modal.active { transform: translate(-50%, -50%) scale(1); opacity: 1; pointer-events: auto; }
        .video-modal video { width: 100%; border-radius: 5px; outline: none; background: #111; }
        .close-vid-btn { margin-top: 10px; padding: 8px 25px; background: #d81b60; color: #fff; border: 1px solid #fff; border-radius: 20px; cursor: pointer; font-family: inherit; font-weight: bold; }

        /* ========================================================= */
        /* کاراکترهای کاملاً سبک، واقعی و بدون لگ با تصاویر اورجینال PNG */
        /* ========================================================= */
        
        .char-group {
            position: absolute; bottom: -300px; z-index: 60; /* قرارگیری کاملا پشت عکس */
            display: flex; justify-content: center; align-items: center; gap: 15px; 
            transition: bottom 1s ease-in-out; pointer-events: none;
        }
        .char-group.show { bottom: 20px; }

        #princesses { left: 5%; }
        #spongebob { right: 5%; }

        /* تصاویر کاراکترها */
        .char-img {
            height: 140px; width: auto; object-fit: contain;
            animation: sway 2.5s infinite alternate ease-in-out;
        }
        .char-img.reverse { animation-direction: alternate-reverse; animation-duration: 3s; }
        
        @keyframes sway {
            0% { transform: translateY(0) rotate(-4deg); }
            100% { transform: translateY(-15px) rotate(4deg); }
        }

        /* فرشته‌های سبک در بالا (استفاده از تصاویر آماده بجای کدهای سنگین) */
        .angels-fixed-container { position: fixed; top: 5%; width: 100%; height: 100%; pointer-events: none; display: none; z-index: 40; }
        .angels-fixed-container.show { display: block; }
        .angel-img {
            position: absolute; width: 65px; height: auto;
            animation: angelDance 3s infinite alternate ease-in-out;
        }
        .a1 { left: 10%; }
        .a2 { left: 30%; top: 40px; animation-direction: alternate-reverse; animation-duration: 2.5s; }
        .a3 { left: 50%; animation-duration: 3.5s; }
        .a4 { right: 30%; top: 30px; animation-direction: alternate-reverse; animation-duration: 2.8s; transform: scaleX(-1); }
        .a5 { right: 10%; animation-duration: 3.2s; transform: scaleX(-1); }
        @keyframes angelDance { 0% { transform: translateY(0) rotate(5deg); } 100% { transform: translateY(-25px) rotate(-5deg); } }

        /* هلو کیتی شناور فوق سبک */
        .hk-doll { position: fixed; z-index: 50; top: 0; left: 0; pointer-events: none; }

        /* آتش بازی سبک شده */
        .firework { position: absolute; bottom: 0; width: 4px; height: 25px; border-radius: 2px; animation: shoot 1s cubic-bezier(0.25, 1, 0.5, 1) forwards; z-index: 5; }
        @keyframes shoot { 0% { transform: translateY(0) scaleY(1); opacity: 1; } 100% { transform: translateY(var(--fw-height)) scaleY(0.5); opacity: 0; } }
        .fw-particle { position: absolute; width: 8px; height: 8px; border-radius: 50%; animation: explode 1s ease-out forwards; z-index: 5; }
        @keyframes explode { 0% { transform: translate(0, 0) scale(1); opacity: 1; } 100% { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; } }
        .confetti { position: absolute; width: 10px; height: 10px; z-index: 20; opacity: 0; }
        @keyframes fall { 0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; } 100% { transform: translateY(110vh) rotate(720deg); opacity: 0; } }

        /* ========================================= */
        /* ----- تنظیمات ریسپانسیو (موبایل و ضد-لگ) ----- */
        /* ========================================= */
        @media (max-width: 768px) {
            /* حذف تمام سایه‌ها برای تضمین 60 فریم بر ثانیه در موبایل */
            .click-me-hint { box-shadow: none; animation: none; border: none; }
            
            .envelope-container { transform: scale(0.85); }
            .envelope-container:hover { transform: scale(0.9); }
            
            /* انیمیشن زوم عکس مخصوص موبایل */
            .envelope-container.open .card { animation: cardOutAndCenterMobile 2.5s ease-in-out 0.4s forwards; }
            
            /* پرنسس‌ها و باب اسفنجی در موبایل به گوشه‌ها چسبیده و کوچکتر می‌شوند */
            .char-group { gap: 5px; }
            .char-img { height: 110px; } /* کوچکتر شدن برای جا شدن در کادر */
            
            #princesses { left: -10px; transform: scale(0.85); transform-origin: bottom left; }
            #spongebob { right: -10px; transform: scale(0.85); transform-origin: bottom right; }

            .angels-fixed-container { transform: scale(0.65); transform-origin: top center; }
            
            /* صندوقچه در موبایل: گوشه راست و بالا */
            .corner-chest-wrapper { right: 0px; top: 10px; transform: scale(0.8) translateY(-150px); z-index: 3000;}
            .corner-chest-wrapper.show { transform: scale(0.8) translateY(0); }
            
            .video-modal { width: 95%; padding: 5px; z-index: 5000;}
        }

        /* انیمیشن زوم موبایل کاملا بهینه شده و خوانا (بزرگتر و پایین‌تر) */
        @keyframes cardOutAndCenterMobile {
            0% { transform: translateY(0) scale(1); z-index: 2; height: 190px; }
            40% { transform: translateY(-250px) scale(1.1); z-index: 1500; height: 190px; }
            100% { transform: translateY(-40px) scale(2.5); z-index: 1500; height: 250px; box-shadow: 0 10px 40px rgba(0,0,0,0.8); }
        }
    </style>
</head>
<body>

    <audio id="birthday-song" src="music.mp3" preload="auto" onerror="console.log('آهنگ پیدا نشد')"></audio>
    <div class="stars" id="stars"></div>

    <!-- پاکت نامه اصلی و مرکزی -->
    <div class="envelope-container" id="envelope">
        <div class="envelope-back"></div>
        <div class="card">
            <!-- تصویر دعوتنامه شما -->
            <img src="mahia.webp" width="1792" height="2390" alt="عکس تولد ماهیا" onerror="console.log('عکس پیدا نشد')">
        </div>
        <div class="envelope-front-sides"></div><div class="envelope-front-sides right"></div>
        <div class="envelope-front"></div><div class="envelope-flap"></div>
        <div class="envelope-text"><span class="balloon-icon">🎈🎈</span>دعوتنامه تولد<br><span style="font-size: 12px; font-weight: normal;">(برای باز کردن کلیک کنید)</span></div>
    </div>

    <!-- صندوقچه جادویی -->
    <div class="corner-chest-wrapper" id="cornerChest">
        <div class="click-me-hint">کادوی شما!<br>کلیک کن 🎁</div>
        <div class="corner-chest-inner">
            <div class="chest-base"></div>
            <div class="chest-lid"></div>
            <div class="chest-lock-diamond"></div>
            <div class="chest-diamond-inside">💎</div>
        </div>
    </div>

    <!-- مودال نمایش ویدیو -->
    <div class="video-modal" id="videoModal">
        <video id="my-video" src="video.mp4" controls preload="metadata"></video>
        <button class="close-vid-btn" id="closeVideo">بستن ویدیو</button>
    </div>

    <!-- فرشته‌های بالا (با استفاده از تصاویر ایموجی استاندارد وب که لگ نمی‌زنند) -->
    <div class="angels-fixed-container" id="angels">
        <img src="https://cdnjs.cloudflare.com/ajax/libs/twemoji/14.0.2/72x72/1f9da.png" class="angel-img a1" alt="Fairy">
        <img src="https://cdnjs.cloudflare.com/ajax/libs/twemoji/14.0.2/72x72/1f9da.png" class="angel-img a2" alt="Fairy">
        <img src="https://cdnjs.cloudflare.com/ajax/libs/twemoji/14.0.2/72x72/1f9da.png" class="angel-img a3" alt="Fairy">
        <img src="https://cdnjs.cloudflare.com/ajax/libs/twemoji/14.0.2/72x72/1f9da.png" class="angel-img a4" alt="Fairy">
        <img src="https://cdnjs.cloudflare.com/ajax/libs/twemoji/14.0.2/72x72/1f9da.png" class="angel-img a5" alt="Fairy">
    </div>

    <!-- پرنسس‌های دیزنی (سمت چپ) با استفاده از تصاویر PNG اورجینال -->
    <div class="char-group" id="princesses">
        <img src="https://upload.wikimedia.org/wikipedia/en/c/c2/Cinderella_Disney_character.png" alt="Cinderella" class="char-img">
        <img src="https://upload.wikimedia.org/wikipedia/en/5/58/Snow_White_Disney_character.png" alt="Snow White" class="char-img reverse">
        <img src="https://upload.wikimedia.org/wikipedia/en/5/5e/Elsa_from_Disney%27s_Frozen.png" alt="Elsa" class="char-img">
        <img src="https://upload.wikimedia.org/wikipedia/en/e/e0/Merida_%28Disney_character%29.png" alt="Merida" class="char-img reverse">
    </div>

    <!-- باب اسفنجی و پاتریک (سمت راست) با استفاده از تصاویر PNG اورجینال -->
    <div class="char-group" id="spongebob">
        <img src="https://upload.wikimedia.org/wikipedia/en/thumb/3/3b/SpongeBob_SquarePants_character.svg/200px-SpongeBob_SquarePants_character.svg.png" alt="SpongeBob" class="char-img reverse" style="height:120px;">
        <img src="https://upload.wikimedia.org/wikipedia/en/thumb/3/33/Patrick_Star.svg/200px-Patrick_Star.svg.png" alt="Patrick" class="char-img" style="height:130px;">
    </div>

    <script>
        const isMobile = window.innerWidth <= 768;

        // ایجاد ستاره‌های پس‌زمینه (کاهش تعداد در موبایل برای رفع لگ)
        function createStars() {
            const starContainer = document.getElementById('stars');
            const count = isMobile ? 20 : 60; 
            for(let i=0; i<count; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.width = Math.random() * 3 + 'px';
                star.style.height = star.style.width;
                star.style.left = Math.random() * 100 + 'vw';
                star.style.top = Math.random() * 100 + 'vh';
                star.style.animationDuration = (Math.random() * 2 + 1) + 's';
                star.style.animationDelay = Math.random() * 2 + 's';
                starContainer.appendChild(star);
            }
        }
        createStars();

        // رویداد کلیک پاکت نامه
        document.getElementById('envelope').addEventListener('click', function() {
            if (this.classList.contains('open')) return;
            this.classList.add('open');

            // --- سیستم دقیق پخش آهنگ پس از 1 ثانیه ---
            const audio = document.getElementById('birthday-song');
            if (audio) {
                // ترفند باز کردن قفل مرورگر موبایل با قول پخش
                audio.play().then(() => {
                    audio.pause();
                    audio.currentTime = 0;
                    
                    // پخش قطعی دقیقاً پس از 1 ثانیه
                    setTimeout(() => {
                        audio.play().catch(e => console.log('خطای صوتی:', e));
                    }, 1000);

                }).catch(err => {
                    // در صورت بروز هرگونه خطا مجدداً یک ثانیه بعد امتحان می‌کند
                    setTimeout(() => {
                        audio.play().catch(e => console.log('خطای صوتی:', e));
                    }, 1000);
                });
            }

            createConfetti();
            createHelloKitties(); // ساخت عروسک‌های شناور
            startFireworks();

            document.getElementById('spongebob').classList.add('show');
            document.getElementById('princesses').classList.add('show');
            document.getElementById('angels').classList.add('show');
            document.getElementById('cornerChest').classList.add('show');
        });

        // کلیک روی صندوقچه
        document.getElementById('cornerChest').addEventListener('click', function() {
            this.classList.add('open');
            setTimeout(() => {
                document.getElementById('videoModal').classList.add('active');
                const video = document.getElementById('my-video');
                video.play().catch(e => console.log('خطا در پخش ویدیو', e));
            }, 600);
        });

        // بستن ویدیو
        document.getElementById('closeVideo').addEventListener('click', function() {
            const video = document.getElementById('my-video');
            video.pause();
            document.getElementById('videoModal').classList.remove('active');
            document.getElementById('cornerChest').classList.remove('open');
        });

        // تولید کاغذ رنگی
        function createConfetti() {
            const colors = ['#ff0044', '#00ff44', '#4400ff', '#ffdd00', '#00eeff', '#ff00dd', '#ffffff'];
            const count = isMobile ? 30 : 80; 
            for (let i = 0; i < count; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.classList.add('confetti');
                    confetti.style.left = Math.random() * 100 + 'vw';
                    confetti.style.top = '-' + (Math.random() * 20 + 10) + 'px';
                    confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                    const duration = Math.random() * 3 + 2;
                    confetti.style.animation = `fall ${duration}s linear forwards`;
                    document.body.appendChild(confetti);
                    setTimeout(() => confetti.remove(), duration * 1000);
                }, i * 20);
            }
        }

        // ----- هلو کیتی شناور با تصویر اصلی و سبک PNG -----
        const kitties = [];
        let kittyLoopStarted = false;
        let screenW = window.innerWidth;
        let screenH = window.innerHeight;

        window.addEventListener('resize', () => { screenW = window.innerWidth; screenH = window.innerHeight; });

        function createHelloKitties() {
            // استفاده از 35 عدد در دسکتاپ و 15 عدد در موبایل برای حفظ نهایت روانی دستگاه
            const count = isMobile ? 15 : 35; 
            
            // تصویر اورجینال، سبک و کامل هلو کیتی
            const kittyImgUrl = "https://upload.wikimedia.org/wikipedia/en/thumb/0/05/Hello_kitty_character_portrait.png/200px-Hello_kitty_character_portrait.png";

            for (let i = 0; i < count; i++) {
                setTimeout(() => {
                    const hk = document.createElement('img');
                    hk.className = 'hk-doll';
                    hk.src = kittyImgUrl;
                    hk.alt = "Hello Kitty";
                    
                    document.body.appendChild(hk);
                    
                    const scale = 0.5 + Math.random() * 0.3;
                    const w = 80 * scale; 
                    const h = 80 * scale;
                    
                    let x = Math.random() * (screenW - w);
                    let y = Math.random() * (screenH - h);
                    
                    // سرعت حرکت تصادفی
                    let vx = (Math.random() > 0.5 ? 1 : -1) * (1 + Math.random() * 2);
                    let vy = (Math.random() > 0.5 ? 1 : -1) * (1 + Math.random() * 2);
                    
                    kitties.push({ el: hk, x: x, y: y, vx: vx, vy: vy, w: w, h: h, scale: scale });
                }, i * 100);
            }

            if (!kittyLoopStarted) {
                kittyLoopStarted = true;
                requestAnimationFrame(animateKitties);
            }
        }

        // حرکت روان با استفاده از شتاب‌دهنده سخت‌افزاری (translate3d)
        function animateKitties() {
            for (let k of kitties) {
                k.x += k.vx;
                k.y += k.vy;

                // برخورد به دیواره‌ها و برگشت
                if (k.x <= 0) { k.x = 0; k.vx *= -1; }
                if (k.x + k.w >= screenW) { k.x = screenW - k.w; k.vx *= -1; }
                if (k.y <= 0) { k.y = 0; k.vy *= -1; }
                if (k.y + k.h >= screenH) { k.y = screenH - k.h; k.vy *= -1; }

                k.el.style.transform = `translate3d(${k.x}px, ${k.y}px, 0) scale(${k.scale})`;
            }
            requestAnimationFrame(animateKitties);
        }

        // سیستم آتش بازی کاملاً بهینه شده
        function startFireworks() {
            const interval = isMobile ? 1500 : 800; 
            setInterval(createFirework, interval); 
        }

        function createFirework() {
            const colors = ['#ff0044', '#00ff44', '#4400ff', '#ffdd00', '#00eeff', '#ff00dd', '#ffffff'];
            const color = colors[Math.floor(Math.random() * colors.length)];
            
            const fw = document.createElement('div');
            fw.className = 'firework';
            const left = Math.random() * 95 + 2; 
            const height = -(Math.random() * 50 + 40);
            
            fw.style.left = left + 'vw';
            fw.style.backgroundColor = color; 
            fw.style.setProperty('--fw-height', height + 'vh');
            document.body.appendChild(fw);

            setTimeout(() => {
                const rect = fw.getBoundingClientRect();
                createExplosion(rect.left, rect.top, color);
                fw.remove();
            }, 1000);
        }

        function createExplosion(x, y, color) {
            const particleCount = isMobile ? 12 : 30; // محدودیت در موبایل برای رفع قطعی لگ
            
            for (let i = 0; i < particleCount; i++) {
                const p = document.createElement('div');
                p.className = 'fw-particle';
                p.style.left = x + 'px';
                p.style.top = y + 'px';
                p.style.backgroundColor = color;
                
                const angle = (i * 360) / particleCount + (Math.random() * 10);
                const velocity = 50 + Math.random() * 100; 
                const dx = Math.cos(angle * Math.PI / 180) * velocity;
                const dy = Math.sin(angle * Math.PI / 180) * velocity + 20;
                
                p.style.setProperty('--dx', dx + 'px');
                p.style.setProperty('--dy', dy + 'px');
                
                document.body.appendChild(p);
                setTimeout(() => p.remove(), 1000);
            }
        }
    </script>
